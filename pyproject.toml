[tool.poetry]
name = "datatest"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
psutil = "^6.1.0"
click = "^8.1.7"
click-default-group = "^1.2.4"
click-help-colors = "^0.9.4"
pydantic-settings = "^2.6.1"
click-aliases = "^1.0.5"
python-json-logger = "^2.0.7"
huggingface-hub = {extras = ["hf-transfer"], version = "^0.26.5", optional = true}
codecarbon = { version = "^2.8.2", optional = true}
pynvml = { version = "^12.0.0", optional = true}
torch = { version = "^2.5.1", optional = true}
transformers = { version = "^4.47.1", optional = true}
llama-cpp-python = { version = "^0.3.6", optional = true}
matplotlib = "^3.10.0"

[tool.poetry.extras]
download = ["huggingface-hub"]
measure = ["codecarbon", "pynvml"]
llm = ["torch", "transformers"]
llamacpp = ["llama-cpp-python"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
